name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"

env:
  QT_VERSION: 6.7.2

jobs:
  # ---------- 创建发行版 (最先运行,空壳) ----------
  create-release:
    name: 创建发行版
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag_name: ${{ steps.meta.outputs.tag_name }}
    steps:
      - name: 计算标签名
        id: meta
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag_name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag_name=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: 删除旧的 latest 发行版
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: |
          gh release delete latest --yes --repo "$GITHUB_REPOSITORY" || true
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/latest" || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 创建发行版 (空壳,后续各 job 逐步上传附件)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag_name }}
          name: ${{ steps.meta.outputs.tag_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------- 命令行版 (三平台,各自编译完即上传) ----------
  worldgen-cli:
    name: 命令行版 (${{ matrix.name }})
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            out: build-cli/地图生成器
            release_file: mapgen-cli-linux-x86_64
          - name: macOS
            os: macos-latest
            out: build-cli/地图生成器
            release_file: mapgen-cli-macos-arm64
          - name: Windows
            os: windows-latest
            out: build-cli/地图生成器.exe
            release_file: mapgen-cli-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Install zlib (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zlib1g-dev

      - name: Install MinGW + zlib (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install mingw -y --no-progress
          $env:PATH = "C:\ProgramData\chocolatey\lib\mingw\tools\install\mingw64\bin;" + $env:PATH
          vcpkg install zlib:x64-mingw-dynamic

      - name: Configure CLI (Linux/macOS)
        if: runner.os != 'Windows'
        run: cmake -S 地图生成器 -B build-cli -DCMAKE_BUILD_TYPE=Release

      - name: Configure CLI (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:PATH = "C:\ProgramData\chocolatey\lib\mingw\tools\install\mingw64\bin;" + $env:PATH
          cmake -S 地图生成器 -B build-cli -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER="C:\ProgramData\chocolatey\lib\mingw\tools\install\mingw64\bin\gcc.exe" `
            -DZLIB_INCLUDE_DIR="C:\vcpkg\installed\x64-mingw-dynamic\include" `
            -DZLIB_LIBRARY="C:\vcpkg\installed\x64-mingw-dynamic\lib\libz.dll.a"

      - name: Build CLI
        run: cmake --build build-cli -j3

      - name: 上传到发行版
        shell: bash
        run: |
          cp "${{ matrix.out }}" "${{ matrix.release_file }}"
          gh release upload "${{ needs.create-release.outputs.tag_name }}" "${{ matrix.release_file }}" --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------- GUI 图形版 (三平台,各自编译完即上传) ----------
  worldgen-gui:
    name: GUI (${{ matrix.name }})
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
          - name: macOS
            os: macos-14
          - name: Windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Install Qt (macOS)
        if: runner.os == 'macOS'
        run: brew install qt

      # Ubuntu 24.04 自带 Qt 6.4,避免 aqtinstall 解析 Qt 在线仓库失败(qt_base)
      - name: Install Qt (Linux, apt)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y -qq qt6-base-dev

      # 编译器: choco mingw (含 gcc/g++); Qt: aqtinstall; zlib: vcpkg
      - name: Install Qt (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m pip install --quiet aqtinstall
          python -m aqt install-qt windows desktop ${{ env.QT_VERSION }} win64_mingw -O C:/Qt

      - name: Install MinGW + zlib (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install mingw -y --no-progress
          vcpkg install zlib:x64-mingw-dynamic

      - name: Install build deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zlib1g-dev libgl1-mesa-dev libxkbcommon-dev libfontconfig1-dev libdbus-1-dev libglib2.0-dev libxcb1-dev libxcb-cursor-dev libxcb-icccm4-dev libxcb-image0-dev libxcb-keysyms1-dev libxcb-randr0-dev libxcb-render-util0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxcb-xinerama0-dev

      - name: Configure GUI (macOS)
        if: runner.os == 'macOS'
        run: cmake -S 地图生成器 -B build-gui -DBUILD_GUI=ON -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$(brew --prefix qt)" -DCMAKE_OSX_ARCHITECTURES=arm64

      - name: Configure GUI (Linux)
        if: runner.os == 'Linux'
        run: cmake -S 地图生成器 -B build-gui -DBUILD_GUI=ON -DCMAKE_BUILD_TYPE=Release

      - name: Configure GUI (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:PATH = "C:\ProgramData\chocolatey\lib\mingw\tools\install\mingw64\bin;" + $env:PATH
          cmake -S 地图生成器 -B build-gui -G "MinGW Makefiles" -DBUILD_GUI=ON -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER="C:\ProgramData\chocolatey\lib\mingw\tools\install\mingw64\bin\gcc.exe" `
            -DCMAKE_CXX_COMPILER="C:\ProgramData\chocolatey\lib\mingw\tools\install\mingw64\bin\g++.exe" `
            -DCMAKE_PREFIX_PATH="C:/Qt/${{ env.QT_VERSION }}/mingw_64" `
            -DZLIB_INCLUDE_DIR="C:\vcpkg\installed\x64-mingw-dynamic\include" `
            -DZLIB_LIBRARY="C:\vcpkg\installed\x64-mingw-dynamic\lib\libz.dll.a"

      - name: Build GUI (macOS/Linux)
        if: runner.os != 'Windows'
        run: cmake --build build-gui -j3

      - name: Build GUI (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:PATH = "C:\ProgramData\chocolatey\lib\mingw\tools\install\mingw64\bin;" + $env:PATH
          cmake --build build-gui -j3

      - name: Package & Upload (macOS)
        if: runner.os == 'macOS'
        run: |
          "$(brew --prefix qt)/bin/macdeployqt" build-gui/地图生成器.app -always-overwrite
          hdiutil create -volname "地图生成器" -srcfolder build-gui/地图生成器.app -ov -format UDZO mapgen-gui-macos-arm64.dmg
          gh release upload "${{ needs.create-release.outputs.tag_name }}" "mapgen-gui-macos-arm64.dmg" --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package & Upload (Linux)
        if: runner.os == 'Linux'
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy*.AppImage
          export PATH=/usr/lib/qt6/bin:$PATH
          export LD_LIBRARY_PATH=/usr/lib/x86_64-linux-gnu:$LD_LIBRARY_PATH
          printf '%s\n' '[Desktop Entry]' 'Name=地图生成器' 'Comment=地图生成器' 'Exec=地图生成器' 'Icon=worldgen_gui' 'Type=Application' 'Categories=Utility;Graphics;' > worldgen_gui.desktop
          cp 地图生成器/src/gui/images/world-generator-icon.png worldgen_gui.png
          set +e
          ./linuxdeploy-x86_64.AppImage --appimage-extract-and-run --appdir AppDir \
            --executable build-gui/地图生成器 \
            --desktop-file worldgen_gui.desktop \
            --icon-file worldgen_gui.png \
            --plugin qt --output appimage
          set -e
          if ls worldgen_gui-*.AppImage >/dev/null 2>&1; then
            mv worldgen_gui-*.AppImage mapgen-gui-linux-x86_64.AppImage
            gh release upload "${{ needs.create-release.outputs.tag_name }}" "mapgen-gui-linux-x86_64.AppImage" --clobber
          else
            echo "AppImage 打包失败,退回压缩包"
            tar -czf mapgen-gui-linux-x86_64.tar.gz -C build-gui 地图生成器
            gh release upload "${{ needs.create-release.outputs.tag_name }}" "mapgen-gui-linux-x86_64.tar.gz" --clobber
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package & Upload (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:PATH = "C:\Qt\${{ env.QT_VERSION }}\mingw_64\bin;C:\ProgramData\chocolatey\lib\mingw\tools\install\mingw64\bin;" + $env:PATH
          windeployqt --no-translations --no-compiler-runtime build-gui/地图生成器.exe
          Copy-Item "C:\ProgramData\chocolatey\lib\mingw\tools\install\mingw64\bin\libgcc_s_seh-1.dll" build-gui\
          Copy-Item "C:\ProgramData\chocolatey\lib\mingw\tools\install\mingw64\bin\libstdc++-6.dll" build-gui\
          Copy-Item "C:\ProgramData\chocolatey\lib\mingw\tools\install\mingw64\bin\libwinpthread-1.dll" build-gui\
          Compress-Archive -Path build-gui\* -DestinationPath mapgen-gui-windows-x86_64.zip
          gh release upload "${{ needs.create-release.outputs.tag_name }}" "mapgen-gui-windows-x86_64.zip" --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
